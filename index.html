<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinate Lost</title>
  
  <!-- ייבוא פונטים של מכונת כתיבה ודפוס ישן -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d; /* שחור עמוק מאוד, מעט פחות "דיגיטלי" משחור מוחלט */
      color: #e0e0e0; /* לבן-מלוכלך/שנהב עדין המדמה דיו או נייר ישן, פחות זוהר מלבן טהור */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Special Elite', 'Courier New', Courier, serif;
      overflow: hidden;
      cursor: none;
    }
    #counter {
      font-size: clamp(2.2rem, 7.5vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.12em; /* ריווח אופייני להדפסות מכניות */
      font-variant-numeric: tabular-nums;
      user-select: none;
      
      /* אפקטים עדינים לשיפור מראה הדפוס הידני */
      text-shadow: 0 0 1px rgba(255,255,255,0.1); 
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div id="counter">1791963000</div>

  <script>
    const START_EPOCH = 1791963000; 
    const TARGET_VALUE = 504599400;

    const el = document.getElementById("counter");

    function update() {
      const now = Math.floor(Date.now() / 1000);

      if (now < START_EPOCH) {
        el.textContent = START_EPOCH;
        return;
      }

      const elapsed = now - START_EPOCH;
      const current = START_EPOCH - elapsed;

      if (current <= TARGET_VALUE) {
        el.textContent = TARGET_VALUE;
      } else {
        el.textContent = current;
      }
    }

    update();
    setInterval(update, 1000);

    // לחיצה בכל מקום מעבירה למסך מלא
    document.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
  </script>

</body>
</html>
