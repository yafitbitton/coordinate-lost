<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinate Lost</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      cursor: none;
    }
    #counter {
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="counter">1791963000</div>

  <script>
    // נקודת פתיחה: 14 באוקטובר 2026, 10:30:00 (שעון ישראל)
    const START_EPOCH = 1791963000; 
    // נקודת היעד בעבר
    const TARGET_VALUE = 504599400;

    const el = document.getElementById("counter");

    function update() {
      const now = Math.floor(Date.now() / 1000);

      if (now < START_EPOCH) {
        el.textContent = START_EPOCH;
        return;
      }

      // הזמן שחלף בעולם האמיתי מאז 10:30
      const elapsed = now - START_EPOCH;
      
      // תנועה אחורה בזמן מנקודת הפתיחה לעבר נקודת היעד
      const current = START_EPOCH - elapsed;

      if (current <= TARGET_VALUE) {
        el.textContent = TARGET_VALUE;
      } else {
        el.textContent = current;
      }
    }

    update();
    setInterval(update, 1000);

    // לחיצה בכל מקום מעבירה למסך מלא ומעלימה את שורת ה-URL
    document.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
  </script>

</body>
</html>
