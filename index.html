<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinate Lost</title>
  
  <!-- ייבוא IBM Plex Mono במשקלים דקים (200 ו-300) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden;
      cursor: none;
    }
    #counter {
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      font-weight: 200; /* משקל קו דקיק ומעודן (ניתן לשנות ל-300 אם תרצי מעט יותר נוכחות) */
      letter-spacing: 0.14em; /* ריווח אותיות מעט פתוח יותר להדגשת הקו הדק */
      font-variant-numeric: tabular-nums;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>

  <div id="counter">1791963000</div>

  <script>
    const START_EPOCH = 1791963000; 
    const TARGET_VALUE = 504599400;

    const el = document.getElementById("counter");

    function update() {
      const now = Math.floor(Date.now() / 1000);

      if (now < START_EPOCH) {
        el.textContent = START_EPOCH;
        return;
      }

      const elapsed = now - START_EPOCH;
      const current = START_EPOCH - elapsed;

      if (current <= TARGET_VALUE) {
        el.textContent = TARGET_VALUE;
      } else {
        el.textContent = current;
      }
    }

    update();
    setInterval(update, 1000);

    // לחיצה בכל מקום מעבירה למסך מלא
    document.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
  </script>

</body>
</html>
