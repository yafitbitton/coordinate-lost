<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinate Lost</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }
    .timer-display {
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="counter" class="timer-display">1791963000</div>

  <script>
    // נקודת התחלה: 10:30:00 (14 באוקטובר 2026)
    const START_VALUE = 1791963000;
    // נקודת יעד סופית
    const TARGET_VALUE = 504599400;

    const counterElement = document.getElementById("counter");

    function update() {
      const now = Math.floor(Date.now() / 1000);

      if (now < START_VALUE) {
        counterElement.textContent = START_VALUE;
        return;
      }

      const elapsed = now - START_VALUE;
      const currentValue = START_VALUE - elapsed;

      if (currentValue <= TARGET_VALUE) {
        counterElement.textContent = TARGET_VALUE;
      } else {
        counterElement.textContent = currentValue;
      }
    }

    update();
    setInterval(update, 1000);
  </script>

</body>
</html>
